name: Cloudflare quota probe and one-time storybook resume

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-quota-probe.yml"

permissions:
  contents: read
  actions: write

jobs:
  probe-and-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test one minimal Cloudflare text request
        id: probe
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import os, sys, requests

          account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "").strip()
          token = os.environ.get("CLOUDFLARE_API_TOKEN", "").strip()
          if not account or not token:
              print("Cloudflare credentials are missing; no request was sent.")
              sys.exit(1)

          url = f"https://api.cloudflare.com/client/v4/accounts/{account}/ai/run/@cf/meta/llama-3.1-8b-instruct"
          try:
              response = requests.post(
                  url,
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
                  json={
                      "messages": [
                          {"role": "system", "content": "Reply with one short word."},
                          {"role": "user", "content": "Say OK."}
                      ],
                      "max_tokens": 8
                  },
                  timeout=60
              )
          except requests.RequestException as exc:
              print(f"Cloudflare quota probe network error: {type(exc).__name__}")
              sys.exit(1)

          if not response.ok:
              print(f"Cloudflare quota probe failed: HTTP {response.status_code}")
              try:
                  payload = response.json()
                  for error in payload.get("errors", []):
                      print(f"Cloudflare error code: {error.get('code', 'unknown')}")
                      print(f"Cloudflare message: {error.get('message', 'No message returned')}")
              except ValueError:
                  print("Cloudflare returned a non-JSON error response.")
              sys.exit(1)

          try:
              payload = response.json()
              result = payload.get("result") or {}
              answer = result.get("response") or result.get("output") or result.get("text")
              if not answer and isinstance(result, dict):
                  choices = result.get("choices", [])
                  if choices:
                      answer = choices[0].get("message", {}).get("content")
              if not answer:
                  raise ValueError("Successful HTTP response contained no text output.")
          except (ValueError, AttributeError, TypeError) as exc:
              print(f"Cloudflare probe response validation failed: {exc}")
              sys.exit(1)

          print("Cloudflare minimal text request succeeded. No secret values were displayed.")
          PY

      - name: Dispatch exactly one replacement book for today's Pakistan date
        if: success() && steps.probe.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "generate-final-storybook.yml",
              ref: "main",
              inputs: { bypass_daily_guard: "true" }
            });
            core.notice("Cloudflare probe passed; one controlled replacement generation was dispatched.");
