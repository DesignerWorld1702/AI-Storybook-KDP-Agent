name: Cloudflare quota probe and one-time storybook resume# CI-gated quota probe; run after strict outline beat-length validation fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cloudflare-quota-probe.yml

concurrency:
  group: cloudflare-quota-preflight
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  probe-and-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test one minimal Cloudflare text request
        id: probe
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "").strip()
          token = os.environ.get("CLOUDFLARE_API_TOKEN", "").strip()
          if not account or not token:
              print("Cloudflare credentials are missing; no request was sent.")
              sys.exit(1)

          url = (
              f"https://api.cloudflare.com/client/v4/accounts/{account}"
              "/ai/run/@cf/meta/llama-3.1-8b-instruct"
          )
          payload = {
              "messages": [
                  {"role": "system", "content": "Reply with one short word."},
                  {"role": "user", "content": "Say OK."}
              ],
              "max_tokens": 8
          }
          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json"
              },
              method="POST"
          )
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  body = response.read().decode("utf-8", errors="replace")
                  status = response.status
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              print(f"Cloudflare quota probe failed: HTTP {exc.code}")
              try:
                  for error in json.loads(body).get("errors", []):
                      print(f"Cloudflare error code: {error.get('code', 'unknown')}")
                      print(f"Cloudflare message: {error.get('message', 'No message returned')}")
              except (ValueError, AttributeError):
                  print("Cloudflare returned a non-JSON error response.")
              sys.exit(1)
          except (urllib.error.URLError, TimeoutError) as exc:
              print(f"Cloudflare quota probe network error: {type(exc).__name__}")
              sys.exit(1)

          if status < 200 or status >= 300:
              print(f"Cloudflare quota probe failed: HTTP {status}")
              sys.exit(1)
          try:
              result = json.loads(body).get("result") or {}
              answer = result.get("response") or result.get("output") or result.get("text")
              if not answer and isinstance(result, dict):
                  choices = result.get("choices", [])
                  if choices:
                      answer = choices[0].get("message", {}).get("content")
              if not answer:
                  raise ValueError("Successful response contained no text output.")
          except (ValueError, AttributeError, TypeError) as exc:
              print(f"Cloudflare probe response validation failed: {exc}")
              sys.exit(1)

          print("Cloudflare minimal text request succeeded. No secret values were displayed.")
          PY

      - name: Wait for repository validation workflows to pass
        if: success() && steps.probe.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const required = ["Python syntax check", "Package safe Windows update"];
            const sha = context.sha;
            const deadline = Date.now() + 6 * 60 * 1000;
            while (Date.now() < deadline) {
              const runs = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner, repo: context.repo.repo, head_sha: sha, per_page: 30
              });
              const matches = required.map(name => runs.data.workflow_runs.find(run => run.name === name));
              if (matches.every(Boolean)) {
                if (matches.some(run => run.conclusion && run.conclusion !== "success")) {
                  core.setFailed("A required CI validation workflow failed; generation is blocked.");
                  return;
                }
                if (matches.every(run => run.status === "completed" && run.conclusion === "success")) {
                  core.notice("Both required validation workflows passed for " + sha + ".");
                  return;
                }
              }
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
            core.setFailed("Timed out waiting for required CI workflows; generation is blocked.");

      - name: Dispatch a guarded book-generation run after quota preflight
        if: success() && steps.probe.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "generate-final-storybook.yml",
              ref: "main",
              inputs: { bypass_daily_guard: "false" }
            });
            core.notice("Cloudflare probe passed; one generation run was dispatched without bypassing the daily guard.");
