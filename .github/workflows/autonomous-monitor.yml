name: Autonomous agent monitor (5-minute, quota-aware)
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/autonomous-monitor.yml
permissions:
  contents: write
  actions: write
concurrency:
  group: autonomous-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check quota pause marker (skip remote checks while paused)
        id: pause
        shell: bash
        run: |
          today="$(TZ=Asia/Karachi date +%F)"
          marker="state/image_quota_pause_until.txt"
          pause_until="$(cat "$marker" 2>/dev/null || true)"
          if [ -n "$pause_until" ] && [[ "$pause_until" > "$today" || "$pause_until" == "$today" ]]; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
            echo "Quota pause active through $pause_until Pakistan time; skip all checks."
          else
            echo "paused=false" >> "$GITHUB_OUTPUT"
            if [ -f "$marker" ]; then rm -f "$marker"; fi
          fi
      - name: Inspect recent failed book run for quota exhaustion
        if: steps.pause.outputs.paused != 'true'
        id: detect
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: "generate-final-storybook.yml", branch: "main", per_page: 5
            });
            const run = runs.data.workflow_runs.find(r => r.status === "completed" && ["failure", "timed_out"].includes(r.conclusion));
            if (!run) { core.notice("No recent failed generation run."); return; }
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: run.id, per_page: 50
            });
            const failed = jobs.data.jobs.filter(j => j.conclusion === "failure");
            const patterns = [
              /daily.{0,30}(quota|limit|allowance).{0,30}(exhaust|exceed|reach|limit)/i,
              /(quota|rate.?limit).{0,40}(exhaust|exceed|insufficient|429)/i,
              /too many requests.{0,40}(daily|quota|limit)/i,
              /exceeded.{0,30}(daily|quota|limit)/i,
              /insufficient credits|no credits remaining/i
            ];
            let quotaHit = false;
            for (const job of failed) {
              try {
                const response = await github.rest.actions.downloadJobLogsForWorkflowRun({
                  owner: context.repo.owner, repo: context.repo.repo, job_id: job.id
                });
                if (patterns.some(p => p.test(String(response.data || "")))) quotaHit = true;
              } catch (e) { core.warning("Could not read job log; quota status unchanged."); }
            }
            core.setOutput("quota_hit", quotaHit ? "true" : "false");
            core.setOutput("failed_run_id", String(run.id));
            if (quotaHit) core.warning("Daily image quota exhaustion detected.");
      - name: Pause generation until next Pakistan date
        if: steps.pause.outputs.paused != 'true' && steps.detect.outputs.quota_hit == 'true'
        shell: bash
        run: |
          tomorrow="$(TZ=Asia/Karachi date -d 'tomorrow' +%F)"
          mkdir -p state
          echo "$tomorrow" > state/image_quota_pause_until.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/image_quota_pause_until.txt
          git commit -m "Pause image generation until quota renewal ($tomorrow)"
          git push origin HEAD:main
      - name: Dispatch AI repair for non-quota failures (once per run)
        if: steps.pause.outputs.paused != 'true' && steps.detect.outputs.quota_hit != 'true' && steps.detect.outputs.failed_run_id != ''
        uses: actions/github-script@v7
        with:
          script: |
            const runId = String("${{ steps.detect.outputs.failed_run_id }}");
            const markerPath = "state/last_autonomous_repair_run.txt";
            const { data: file } = await github.rest.repos.getContent({
              owner: context.repo.owner, repo: context.repo.repo, path: markerPath
            }).catch(() => ({ data: null }));
            const previous = file ? Buffer.from(file.content, "base64").toString().trim() : "";
            if (previous === runId) { core.notice("Already dispatched for this run."); return; }
            const { execSync } = require("child_process");
            execSync("git config user.name github-actions[bot]");
            execSync("git config user.email 41898282+github-actions[bot]@users.noreply.github.com");
            execSync("mkdir -p state && printf %s \\n " + runId + " > state/last_autonomous_repair_run.txt");
            execSync("git add state/last_autonomous_repair_run.txt && git commit -m \\n " + JSON.stringify("Record autonomous repair dispatch " + runId) + " && git push origin HEAD:main");
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: "autonomous-repair.yml", ref: "main", inputs: { failed_run_id: runId }
            });
            core.notice("Dispatched repair workflow for failed run " + runId);
      - name: Status
        if: always()
        run: |
          if [ "${{ steps.pause.outputs.paused }}" = "true" ]; then
            echo "Quota pause is active; skipped remote monitoring."
          elif [ "${{ steps.detect.outputs.quota_hit }}" = "true" ]; then
            echo "Quota exhaustion detected and pause recorded."
          else
            echo "No quota exhaustion detected."
          fi
