name: Generate final 50-scene storybook

on:
  push:
    paths:
      - ".github/workflows/storybook-run-trigger.txt"
  workflow_dispatch:
    inputs:
      bypass_daily_guard:
        description: "Allow one manually approved replacement run even if today's book already exists"
        required: false
        type: boolean
        default: false
  schedule:
    # 20:00 Pakistan Standard Time (UTC+5) = 15:00 UTC.
    - cron: "0 15 * * *"

permissions:
  contents: write

concurrency:
  # Serialize manual and scheduled runs so a queued schedule can see the
  # success marker written by an earlier run on the same Pakistan date.
  group: daily-storybook-one-per-day
  cancel-in-progress: false

jobs:
  generate-book:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out canonical project
        uses: actions/checkout@v4

      - name: Check whether today's Pakistan-date book is already complete
        id: daily_guard
        shell: bash
        run: |
          today="$(TZ=Asia/Karachi date +%F)"
          marker="state/last_successful_book_date.txt"
          marker_date="$(cat "$marker" 2>/dev/null || true)"
          bypass="${{ github.event_name == 'workflow_dispatch' && inputs.bypass_daily_guard }}"
          if [ "$bypass" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "One-time manual replacement override approved for $today; existing output will be preserved."
          elif [ -f "$marker" ] && [ "$marker_date" = "$today" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "A successful book already exists for $today (Asia/Karachi); skipping this run."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "No successful book marker for $today; generation may proceed."
          fi

      - name: Set up Python
        if: steps.daily_guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        if: steps.daily_guard.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Cloudflare credentials are present
        if: steps.daily_guard.outputs.skip != 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import os
          assert os.environ.get("CLOUDFLARE_ACCOUNT_ID", "").strip(), "CLOUDFLARE_ACCOUNT_ID secret is missing."
          assert os.environ.get("CLOUDFLARE_API_TOKEN", "").strip(), "CLOUDFLARE_API_TOKEN secret is missing."
          print("Cloudflare credentials are available. Secret values are not displayed.")
          PY

      - name: Generate one complete 50-scene book
        if: steps.daily_guard.outputs.skip != 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_TEXT_MODEL: "@cf/meta/llama-3.1-8b-instruct"
          CLOUDFLARE_IMAGE_MODEL: "@cf/black-forest-labs/flux-2-klein-4b"
          STORY_IMAGE_MAX_SIDE: "1536"
          TZ: "Asia/Karachi"
        run: |
          # Preserve the previous book as a timestamped backup before a one-time replacement.
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.bypass_daily_guard }}" = "true" ]; then
            today="$(TZ=Asia/Karachi date +%F)"
            folder="output/$(TZ=Asia/Karachi date +%Y%m%d)_daily_story"
            if [ -d "$folder" ]; then
              backup="${folder}_backup_before_quality_replacement_$(date -u +%H%M%S)"
              cp -a "$folder" "$backup"
              echo "Preserved existing book at $backup"
              rm -rf "$folder"
            fi
          fi
          python daily_runner.py --run-now --today-only

      - name: Save generated permanent character references to main
        if: always() && steps.daily_guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A character_library/models
          if git diff --cached --quiet; then
            echo "No new permanent reference images to save."
          else
            git commit -m "Save generated permanent character reference images"
            git push origin HEAD:main
          fi

      - name: Verify final book files
        if: always() && steps.daily_guard.outputs.skip != 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, sys
          root = Path("output")
          folders = sorted(p for p in root.glob("*_daily_story") if p.is_dir()) if root.exists() else []
          if not folders:
              print("No book output folder was created.")
              sys.exit(1)
          book = folders[-1]
          status_file = book / "job_status.json"
          status = json.loads(status_file.read_text(encoding="utf-8")) if status_file.exists() else {}
          print("Book folder:", book)
          print("Status:", status.get("status", "unknown"))
          for name in ["story.json", "storybook_interior.pdf", "kindle_story.html", "kindle_story.epub",
                       "kdp_listing_draft.json", "kdp_listing_draft.txt",
                       "publishing_checklist.txt", "scene_contact_sheet.jpg"]:
              path = book / name
              print(f"{name}: {'present' if path.exists() else 'missing'}")
          scenes = list((book / "scenes").glob("scene_*.png")) if (book / "scenes").exists() else []
          pages = list((book / "pages").glob("page_*.png")) if (book / "pages").exists() else []
          print("Scene illustrations:", len(scenes), "/ 50")
          print("Integrated text-overlay pages:", len(pages), "/ 50")
          print("Story quality report:", "present" if (book / "quality_review.json").is_file() else "missing")
          if (status.get("status") != "completed" or len(scenes) != 50 or len(pages) != 50
              or not (book / "quality_review.json").is_file()
              or not (book / "kindle_story.epub").is_file()):
              sys.exit(1)
          PY

      - name: Mark today's book as successfully completed
        if: success() && steps.daily_guard.outputs.skip != 'true'
        shell: bash
        run: |
          today="$(TZ=Asia/Karachi date +%F)"
          mkdir -p state
          echo "$today" > state/last_successful_book_date.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/last_successful_book_date.txt
          if git diff --cached --quiet; then
            echo "Today's success marker already has the correct date; no marker commit is needed."
          else
            git commit -m "Mark daily storybook complete for $today"
            git push origin HEAD:main
          fi

      - name: Upload generated book package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-storybook-package
          path: |
            output/
            logs/
          if-no-files-found: warn
          retention-days: 14
