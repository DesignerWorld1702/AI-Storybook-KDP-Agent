name: Generate final 50-scene storybook

on:
  workflow_dispatch:
    inputs:
      bypass_daily_guard:
        description: "Allow one manually approved replacement run even if today's book already exists"
        required: false
        type: boolean
        default: false
permissions:
  contents: write
  actions: read

concurrency:
  # Serialize manual and scheduled runs so a queued schedule can see the
  # success marker written by an earlier run on the same Pakistan date.
  group: daily-storybook-one-per-day
  cancel-in-progress: false

jobs:
  generate-book:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out canonical project
        uses: actions/checkout@v4

      - name: Check whether today's Pakistan-date book is already complete
        id: daily_guard
        shell: bash
        run: |
          today="$(TZ=Asia/Karachi date +%F)"
          marker="state/last_successful_book_date.txt"
          marker_date="$(cat "$marker" 2>/dev/null || true)"
          bypass="${{ github.event_name == 'workflow_dispatch' && inputs.bypass_daily_guard }}"
          if [ "$bypass" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "One-time manual replacement override approved for $today; existing output will be preserved."
          elif [ -f "$marker" ] && [ "$marker_date" = "$today" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "A successful book already exists for $today (Asia/Karachi); skipping this run."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "No successful book marker for $today; generation may proceed."
          fi

      - name: Find the latest recent failed run artifact for a resumable book
        id: resume_source
        if: steps.daily_guard.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: "generate-final-storybook.yml", branch: "main", per_page: 30
            });
            for (const run of runs.data.workflow_runs) {
              if (run.id === context.runId || !["failure", "cancelled", "timed_out"].includes(run.conclusion)) continue;
              const ageMs = Date.now() - new Date(run.created_at).getTime();
              if (ageMs < 0 || ageMs > 3 * 24 * 60 * 60 * 1000) continue;
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner, repo: context.repo.repo, run_id: run.id
              });
              const artifact = artifacts.data.artifacts.find(item => item.name === "final-storybook-package" && !item.expired);
              if (artifact && artifact.size_in_bytes >= 50000) {
                core.setOutput("run_id", String(run.id));
                core.notice("Found a substantial resumable book artifact from run " + run.id + ".");
                return;
              }
            }
            core.notice("No recent substantial failed-book artifact is available to resume.");

      - name: Download resumable book artifact
        if: steps.daily_guard.outputs.skip != 'true' && steps.resume_source.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: final-storybook-package
          run-id: ${{ steps.resume_source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: .resume-artifact

      - name: Restore the newest incomplete book files
        id: restore_book
        if: steps.daily_guard.outputs.skip != 'true' && steps.resume_source.outputs.run_id != ''
        shell: bash
        run: |
          mkdir -p output
          restored=false
          for source in $(find .resume-artifact/output -mindepth 1 -maxdepth 1 -type d -name '????????_daily_story' 2>/dev/null | sort -r); do
            status="unknown"
            if [ -f "$source/job_status.json" ]; then
              status="$(jq -r '.status // "unknown"' "$source/job_status.json")"
            fi
            if [ "$status" != "completed" ] || [ ! -f "$source/publication_package_verified.json" ]; then
              target="output/$(basename "$source")"
              if [ ! -e "$target" ]; then
                cp -a "$source" "$target"
              fi
              echo "resume=true" >> "$GITHUB_OUTPUT"
              echo "Restored incomplete book $(basename "$source") from run ${{ steps.resume_source.outputs.run_id }}."
              restored=true
              break
            fi
          done
          if [ "$restored" = "false" ]; then
            echo "resume=false" >> "$GITHUB_OUTPUT"
            echo "No incomplete book folder was found in the downloaded artifact."
          fi
      - name: Set up Python
        if: steps.daily_guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        if: steps.daily_guard.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Cloudflare credentials are present
        if: steps.daily_guard.outputs.skip != 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import os
          assert os.environ.get("CLOUDFLARE_ACCOUNT_ID", "").strip(), "CLOUDFLARE_ACCOUNT_ID secret is missing."
          assert os.environ.get("CLOUDFLARE_API_TOKEN", "").strip(), "CLOUDFLARE_API_TOKEN secret is missing."
          print("Cloudflare credentials are available. Secret values are not displayed.")
          PY

      - name: Generate one complete 50-scene book
        id: generate_book
        if: steps.daily_guard.outputs.skip != 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_TEXT_MODEL: "@cf/meta/llama-3.1-8b-instruct"
          CLOUDFLARE_IMAGE_MODEL: "@cf/black-forest-labs/flux-2-klein-4b"
          STORY_IMAGE_MAX_SIDE: "1536"
          TZ: "Asia/Karachi"
        run: |
          # Preserve the previous book as a timestamped backup before a one-time replacement.
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.bypass_daily_guard }}" = "true" ]; then
            folder="output/$(TZ=Asia/Karachi date +%Y%m%d)_daily_story"
            if [ -d "$folder" ]; then
              status="$(python -c 'import json,sys,os; p=sys.argv[1]; d=json.load(open(p)) if os.path.isfile(p) else {}; print(d.get("status","unknown"))' "$folder/job_status.json")"
              marker_date="$(cat state/last_successful_book_date.txt 2>/dev/null || true)"
              today="$(TZ=Asia/Karachi date +%F)"
              if [ "$status" = "completed" ] && [ -f "$folder/publication_package_verified.json" ] && [ "$marker_date" = "$today" ]; then
                backup="${folder}_backup_before_quality_replacement_$(date -u +%H%M%S)"
                cp -a "$folder" "$backup"
                echo "Preserved verified previous book at $backup before replacement."
                rm -rf "$folder"
              else
                echo "Keeping book folder for resume/repair (status: $status; package verification marker: $([ -f "$folder/publication_package_verified.json" ] && echo present || echo missing))."
              fi
            fi
          fi
          if [ "${{ steps.restore_book.outputs.resume }}" = "true" ]; then
            python daily_runner.py --resume-incomplete
          else
            python daily_runner.py --run-now --today-only
          fi

      - name: Save generated permanent character references to main
        if: always() && steps.daily_guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A character_library/models
          if git diff --cached --quiet; then
            echo "No new permanent reference images to save."
          else
            git commit -m "Save generated permanent character reference images"
            git push origin HEAD:main
          fi

      - name: Report generation failure without cascading validation errors
        if: always() && steps.daily_guard.outputs.skip != 'true' && steps.generate_book.outcome == 'failure'
        shell: bash
        run: |
          echo "::error::Storybook generation failed before package verification. The original generation error above is the primary failure; package checks are intentionally skipped because incomplete output is expected."
          python - <<'PY'
          from pathlib import Path
          import json
          folders = sorted(Path("output").glob("*_daily_story"))
          if not folders:
              print("No book output folder was created.")
              raise SystemExit(0)
          book = folders[-1]
          status_path = book / "job_status.json"
          if not status_path.is_file():
              print("No job_status.json was written.")
              raise SystemExit(0)
          try:
              status = json.loads(status_path.read_text(encoding="utf-8"))
          except Exception as exc:
              print("Could not read job status:", exc)
              raise SystemExit(0)
          print("Book folder:", book)
          print("Generation status:", status.get("status", "unknown"))
          print("Primary error:", status.get("error", "See generation step logs."))
          PY

      - name: Verify final book files
        if: always() && steps.daily_guard.outputs.skip != 'true' && steps.generate_book.outcome == 'success'
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, sys
          from pypdf import PdfReader
          root = Path("output")
          folders = sorted(p for p in root.glob("*_daily_story") if p.is_dir()) if root.exists() else []
          if not folders:
              print("No book output folder was created.")
              sys.exit(1)
          book = folders[-1]
          status_file = book / "job_status.json"
          status = json.loads(status_file.read_text(encoding="utf-8")) if status_file.exists() else {}
          print("Book folder:", book)
          print("Status:", status.get("status", "unknown"))
          required = ["story.json", "storybook_interior.pdf", "kindle_story.html", "kindle_story.epub",
                      "kdp_listing_draft.json", "kdp_listing_draft.txt",
                      "publishing_checklist.txt", "scene_contact_sheet.jpg",
                      "quality_review.json", "image_quality_report.json", "visual_quality_report.json"]
          missing = []
          for name in required:
              path = book / name
              exists = path.is_file() and path.stat().st_size > 1024
              print(f"{name}: {'present' if exists else 'missing/too small'}")
              if not exists:
                  missing.append(name)
          scenes = list((book / "scenes").glob("scene_*.png")) if (book / "scenes").exists() else []
          pages = list((book / "pages").glob("page_*.png")) if (book / "pages").exists() else []
          print("Scene illustrations:", len(scenes), "/ 50")
          print("Integrated text-overlay pages:", len(pages), "/ 50")
          print("Story quality report:", "present" if (book / "quality_review.json").is_file() else "missing")
          story_file = book / "story.json"
          story = json.loads(story_file.read_text(encoding="utf-8")) if story_file.is_file() else {}
          pdf = book / "storybook_interior.pdf"
          pdf_page_count = 0
          pdf_size_ok = False
          if pdf.is_file():
              with pdf.open("rb") as handle:
                  pdf_header_ok = handle.read(5) == b"%PDF-"
              reader = PdfReader(str(pdf))
              pdf_page_count = len(reader.pages)
              expected_sizes = {
                  "8.5 × 8.5 in — square picture book": (612.0, 612.0),
                  "8.5 × 11 in — portrait picture book": (612.0, 792.0),
                  "6 × 9 in — standard paperback": (432.0, 648.0),
              }
              expected_size = expected_sizes.get(story.get("trim_size"))
              if pdf_page_count == 50 and expected_size:
                  first_page = reader.pages[0]
                  pdf_size_ok = (
                      abs(float(first_page.mediabox.width) - expected_size[0]) < 1.0
                      and abs(float(first_page.mediabox.height) - expected_size[1]) < 1.0
                  )
          else:
              pdf_header_ok = False
          listing = json.loads((book / "kdp_listing_draft.json").read_text(encoding="utf-8")) if (book / "kdp_listing_draft.json").is_file() else {}
          metadata_ok = bool(listing.get("title") and listing.get("author") and listing.get("description") and len(listing.get("keywords", [])) >= 5)
          visual_path = book / "visual_quality_report.json"
          visual = json.loads(visual_path.read_text(encoding="utf-8")) if visual_path.is_file() else {}
          visual_ok = bool(
              visual.get("passed") is True
              and visual.get("reviewed_scenes") == 50
              and visual.get("character_consistency_verified") is True
              and visual.get("scene_accuracy_verified") is True
          )
          print("AI visual review:", "passed" if visual_ok else "FAILED / missing")
          print("Story scenes:", len(story.get("scenes", [])), "/ 50")
          print("PDF header:", "valid" if pdf_header_ok else "invalid")
          print("PDF page count:", pdf_page_count, "/ 50")
          print("PDF trim size:", story.get("trim_size", "missing"), "valid" if pdf_size_ok else "invalid")
          print("Listing metadata:", "valid" if metadata_ok else "incomplete")
          if (status.get("status") != "completed" or len(scenes) != 50 or len(pages) != 50
              or len(story.get("scenes", [])) != 50 or missing or not pdf_header_ok
              or pdf_page_count != 50 or not pdf_size_ok or not metadata_ok or not visual_ok):
              print("Final package validation failed.")
              sys.exit(1)
          import datetime
          (book / "publication_package_verified.json").write_text(
              json.dumps({
                  "verified_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  "verification": "structural and AI-assisted visual quality checks passed",
                  "human_visual_review_required": False,
                  "character_consistency_visually_verified": True,
                  "scene_accuracy_visually_verified": True,
                  "scene_images": len(scenes),
                  "integrated_pages": len(pages),
                  "pdf_pages": pdf_page_count
              }, indent=2),
              encoding="utf-8"
          )
          print("Publication package structural verification marker written.")
          PY

      - name: Mark today's book as successfully completed
        if: success() && steps.daily_guard.outputs.skip != 'true'
        shell: bash
        run: |
          today="$(TZ=Asia/Karachi date +%F)"
          mkdir -p state
          echo "$today" > state/last_successful_book_date.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/last_successful_book_date.txt
          if git diff --cached --quiet; then
            echo "Today's success marker already has the correct date; no marker commit is needed."
          else
            git commit -m "Mark daily storybook complete for $today"
            git push origin HEAD:main
          fi

      - name: Upload generated book package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-storybook-package
          path: |
            output/
            logs/
          if-no-files-found: warn
          retention-days: 14
