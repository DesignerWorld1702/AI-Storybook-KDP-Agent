name: Test Cloudflare GitHub Secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Cloudflare text API credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "").strip()
          token = os.environ.get("CLOUDFLARE_API_TOKEN", "").strip()
          if not account or not token:
              print("FAILED: One or both GitHub repository secrets are missing or empty.")
              sys.exit(1)

          url = (
              "https://api.cloudflare.com/client/v4/accounts/"
              + account
              + "/ai/run/@cf/meta/llama-3.1-8b-instruct"
          )
          payload = {
              "messages": [
                  {"role": "system", "content": "Reply briefly."},
                  {"role": "user", "content": "Reply with exactly: CONNECTION_OK"}
              ],
              "max_tokens": 20
          }
          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + token,
                  "Content-Type": "application/json"
              },
              method="POST"
          )
          try:
              with urllib.request.urlopen(request, timeout=90) as response:
                  data = json.loads(response.read().decode("utf-8"))
              result = data.get("result") or {}
              answer = (
                  result.get("response")
                  or result.get("output")
                  or result.get("text")
                  or ""
              )
              if not answer and result.get("choices"):
                  answer = result["choices"][0].get("message", {}).get("content", "")
              if not answer:
                  print("FAILED: Cloudflare responded, but no text output was found.")
                  sys.exit(1)
              print("SUCCESS: GitHub secrets authenticated and the Cloudflare text model responded.")
              print("Model response:", str(answer)[:160])
          except urllib.error.HTTPError as error:
              detail = error.read().decode("utf-8", "replace")[:500]
              print(f"FAILED: Cloudflare returned HTTP {error.code}: {detail}")
              sys.exit(1)
          except Exception as error:
              print("FAILED:", type(error).__name__, str(error)[:300])
              sys.exit(1)
          PY
